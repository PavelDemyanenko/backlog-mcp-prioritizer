name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (unit, WireMock ITs, STDIO E2E)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v5
        with:
          name: server-jar
          path: target/backlog-mcp-server.jar
          retention-days: 7
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/e2e

  skills:
    name: Calculator and eval pipeline (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -I -B -m unittest discover -s skills/backlog-prioritization-engine/scripts
      - run: python3 -I -B -m unittest discover -s evals/golden
      - run: python3 -I -B evals/golden/build.py --check

  image:
    name: Docker image (stdio smoke)
    runs-on: ubuntu-latest
    needs: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: server-jar
          path: target
      - run: docker build -t backlog-mcp-prioritizer .
      - run: python3 e2e/docker_smoke.py backlog-mcp-prioritizer
