name: Release

# Push a tag like v0.1.0 (must match <version> in pom.xml):
#   git tag -a v0.1.0 -m "0.1.0" && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to ghcr.io

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches pom.xml
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          POM=$(sed -n '0,/<artifactId>backlog-mcp-server<\/artifactId>/d; s:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          echo "tag=$TAG pom=$POM"
          if [ "$TAG" != "$POM" ]; then echo "::error::Tag v$TAG does not match pom.xml ($POM)"; exit 1; fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Server
        run: mvn -B -ntp verify
      - name: Calculator and evals (no LLM)
        run: |
          python3 -I -B -m unittest discover -s skills/backlog-prioritization-engine/scripts
          python3 -I -B -m unittest discover -s evals/golden

      - name: Package assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          cp target/backlog-mcp-server.jar "out/backlog-mcp-server-$VERSION.jar"
          (cd skills && zip -qr "../out/backlog-mcp-prioritizer-skills-$VERSION.zip" backlog-prioritization-engine adr-custodian \
             -x '*/__pycache__/*' '*/test_*.py')
          (cd out && sha256sum * > SHA256SUMS)

      - uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: out/*
      - uses: actions/upload-artifact@v5
        with:
          name: server-jar
          path: target/backlog-mcp-server.jar

  image:
    name: Docker image (ghcr.io)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: server-jar
          path: target
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.build.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Backlog MCP Prioritizer: read-only YouTrack MCP server (stdio)
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.build.outputs.version }}

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build, image]
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<NOTES
          ## Install

          **Server (Docker, no Java needed)**, run inside your project:
          \`\`\`bash
          claude mcp add -s local backlog -e YOUTRACK_BASE_URL=https://yourcompany.youtrack.cloud -e YOUTRACK_TOKEN=perm:xxxx \\
            -- docker run -i --rm -e YOUTRACK_BASE_URL -e YOUTRACK_TOKEN -v "\$PWD/docs/adr:/adr:ro" $IMAGE:$VERSION
          \`\`\`

          **Server (Java 25):** \`claude mcp add -s local backlog -e YOUTRACK_BASE_URL=… -e YOUTRACK_TOKEN=… -- java -jar /ABS/PATH/backlog-mcp-server-$VERSION.jar\`

          **Skills:** \`mkdir -p .claude/skills && unzip backlog-mcp-prioritizer-skills-$VERSION.zip -d .claude/skills/\`

          Full guide: README. Checksums: \`SHA256SUMS\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" \
            --title "Backlog MCP Prioritizer $VERSION" --notes-file notes.md --verify-tag
